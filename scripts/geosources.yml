# Catalogue of external geography for scripts/enrich_geo.py.
#
# Every entry becomes one toggleable layer in the atlas and one file under
# assets/data/layers/. Adding a source is an edit here, not a code change.
#
#   id            file name and DOM id; keep it stable, the front end remembers it
#   group         heading the layer is filed under in the map's Layers panel
#   name          what the reader sees
#   adapter       geojson | ndjson | pleiades | overpass | wikidata
#                 (entries under local_sources are always the local adapter)
#   kind          drives the drawing style: see AtlasMap.STYLES in assets/js/map.js
#   default       true to load the layer on first paint; everything else is
#                 fetched only when the reader switches it on
#   simplify      Douglas-Peucker tolerance in degrees, 0 to keep full detail
#   max_features  cap, applied after sorting by rank then by size
#   licence       shown in the panel; ODbL layers are kept in their own files so
#                 the share-alike obligation does not attach to the whole corpus
#
# Optional, for the geojson and local adapters:
#
#   url           the file to fetch; a WFS GetFeature URL works, GeoServer
#                 returns GeoJSON when asked for outputFormat=application/json
#   extra_urls    further files merged into the same layer
#   name_fields   columns to try for the label, in order, matched case-insensitively
#   keep_fields   columns carried through into the feature properties
#   require_name  drop features with no name; for layers whose point is the name
#   drop_classes  featurecla values to discard
#   rank_field    column used to order features before max_features applies
#
# Sizes below are the download, not the published layer: everything is clipped
# to the corpus bounding box and simplified before it is written.

sources:

  # ---- hydrography and relief -------------------------------------------
  - id: ne-rivers
    group: Hydrography
    name: Rivers
    adapter: geojson
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_rivers_lake_centerlines.geojson
    extra_urls:
      - https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_rivers_europe.geojson
    kind: river
    name_fields: [name_en, name, label]
    rank_field: scalerank
    simplify: 0.002
    default: true
    licence: Public domain
    attribution: Natural Earth 10m

  - id: ne-lakes
    group: Hydrography
    name: Lakes
    adapter: geojson
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_lakes.geojson
    extra_urls:
      - https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_lakes_europe.geojson
    kind: lake
    name_fields: [name_en, name]
    simplify: 0.002
    default: true
    licence: Public domain
    attribution: Natural Earth 10m

  - id: ne-regions
    group: Relief
    name: Named ranges and physical regions
    adapter: geojson
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_geography_regions_polys.geojson
    kind: range
    name_fields: [name_en, name]
    require_name: true
    drop_classes: [continent, island, islands, island group]
    simplify: 0.004
    default: true
    licence: Public domain
    attribution: Natural Earth 10m

  - id: ne-elevation-points
    group: Relief
    name: Named peaks and passes
    adapter: geojson
    url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_geography_regions_elevation_points.geojson
    kind: peak
    name_fields: [name_en, name]
    require_name: true
    default: false
    licence: Public domain
    attribution: Natural Earth 10m

  # ---- ancient geography -------------------------------------------------
  - id: pleiades-places
    group: Ancient geography
    name: Pleiades places
    adapter: pleiades
    part: points
    kind: ancient-place
    default: true
    licence: CC BY 3.0
    attribution: Pleiades, ISAW

  - id: pleiades-polygons
    group: Ancient geography
    name: Pleiades footprints and territories
    adapter: pleiades
    part: polygons
    kind: ancient-footprint
    simplify: 0.0005
    default: false
    licence: CC BY 3.0
    attribution: Pleiades, ISAW

  - id: awmc-shoreline
    group: Ancient geography
    name: Ancient shoreline
    adapter: geojson
    url: https://raw.githubusercontent.com/AWMC/geodata/master/Physical%20Data/shoreline/shoreline.geojson
    kind: coastline
    simplify: 0.002
    default: false
    licence: ODbL
    attribution: Ancient World Mapping Center

  - id: awmc-inland-water
    group: Hydrography
    name: Inland water (AWMC)
    adapter: geojson
    url: https://raw.githubusercontent.com/AWMC/geodata/master/Physical%20Data/inland_water/inland-water-OSM.geojson
    kind: lake
    name_fields: [title, name]
    simplify: 0.002
    default: false
    licence: ODbL
    attribution: Ancient World Mapping Center

  - id: awmc-urban
    group: Ancient geography
    name: Urban areas
    adapter: geojson
    url: https://raw.githubusercontent.com/AWMC/geodata/master/Cultural-Data/urban_areas/urban_areas.geojson
    kind: urban-area
    name_fields: [title, name]
    keep_fields: [pid, type]
    simplify: 0.0004
    default: false
    licence: ODbL
    attribution: Ancient World Mapping Center

  - id: awmc-walls
    group: Ancient geography
    name: City walls
    adapter: geojson
    url: https://raw.githubusercontent.com/AWMC/geodata/master/Cultural-Data/walls/walls.geojson
    kind: wall
    name_fields: [title, name]
    keep_fields: [pid, type]
    simplify: 0.0004
    default: false
    licence: ODbL
    attribution: Ancient World Mapping Center

  - id: awmc-provinces-60bc
    group: Ancient geography
    name: Roman territory, 60 BC
    adapter: geojson
    url: https://raw.githubusercontent.com/AWMC/geodata/master/Cultural-Data/political_shading/roman_empire_bce_60/roman_empire_bce_60.geojson
    kind: province
    name_fields: [title, name]
    keep_fields: [pid]
    simplify: 0.004
    default: false
    licence: ODbL
    attribution: Ancient World Mapping Center

  - id: awmc-provinces-200ce
    group: Ancient geography
    name: Roman provinces, AD 200
    adapter: geojson
    url: https://raw.githubusercontent.com/AWMC/geodata/master/Cultural-Data/political_shading/roman_empire_ce_200_provinces/roman_empire_ce_200_provinces.geojson
    kind: province
    name_fields: [title, name, province]
    keep_fields: [pid]
    simplify: 0.004
    default: false
    licence: ODbL
    attribution: Ancient World Mapping Center

  - id: awmc-regional-names
    group: Ancient geography
    name: Regional and ethnic names (Barrington)
    adapter: geojson
    url: https://raw.githubusercontent.com/AWMC/geodata/master/Cultural-Data/regional_name_linework/regional_names_linework.geojson
    kind: cultural-region
    name_fields: [title, name, label]
    keep_fields: [pid, type, p_min_date, p_max_date]
    require_name: true
    simplify: 0.003
    default: false
    licence: ODbL
    attribution: Ancient World Mapping Center

  - id: awmc-roads
    group: Movement
    name: Roads (Barrington / AWMC)
    adapter: geojson
    url: https://raw.githubusercontent.com/AWMC/geodata/master/Cultural-Data/roads/roads.geojson
    kind: road
    name_fields: [title, name]
    keep_fields: [pid, type, certainty]
    simplify: 0.001
    default: false
    licence: ODbL
    attribution: Ancient World Mapping Center

  - id: awmc-aqueducts
    group: Movement
    name: Aqueducts
    adapter: geojson
    url: https://raw.githubusercontent.com/AWMC/geodata/master/Cultural-Data/aqueducts/aqueducts.geojson
    kind: aqueduct
    name_fields: [title, name]
    keep_fields: [pid]
    simplify: 0.001
    default: false
    licence: ODbL
    attribution: Ancient World Mapping Center

  - id: awmc-canals
    group: Movement
    name: Canals
    adapter: geojson
    url: https://raw.githubusercontent.com/AWMC/geodata/master/Cultural-Data/canals/canals.geojson
    kind: aqueduct
    name_fields: [title, name]
    keep_fields: [pid]
    simplify: 0.001
    default: false
    licence: ODbL
    attribution: Ancient World Mapping Center

  - id: itinere-roads
    group: Movement
    name: Roman roads (Itiner-e)
    adapter: geojson
    # de Soto, Pazout, Brughmans et al., Sci Data 12:1731 (2025).
    # Zenodo: https://doi.org/10.5281/zenodo.17122148
    url: https://api.nakala.fr/data/10.34847/nkl.4a6a7t4l/f2fede84f203e4ccc56e45f3fee20ac77a9b62cc
    kind: roman-road
    name_fields: [name, road_name, label]
    keep_fields: [certainty, pleiadesPlaces, id]
    simplify: 0.0008
    default: false
    licence: CC BY 4.0
    attribution: Itiner-e, de Soto et al. 2025

  # ---- excavated footprints from OpenStreetMap --------------------------
  # Ways and relations, not just nodes: this is where the real site outlines
  # come from, Pompeii and the Tarquinia necropoleis included.
  - id: osm-archaeology
    group: Excavated footprints
    name: Archaeological sites (OSM)
    adapter: overpass
    kind: excavation
    default: false
    tile: 1.5
    simplify: 0.00005
    licence: ODbL
    attribution: OpenStreetMap contributors
    query: |
      [out:json][timeout:{t}];
      (
        way["historic"="archaeological_site"]({s},{w},{n},{e});
        relation["historic"="archaeological_site"]({s},{w},{n},{e});
        way["historic"="city_walls"]({s},{w},{n},{e});
      );
      out geom qt;

  - id: osm-tombs
    group: Excavated footprints
    name: Tombs and tumuli (OSM)
    adapter: overpass
    kind: tomb
    default: false
    tile: 1.5
    licence: ODbL
    attribution: OpenStreetMap contributors
    query: |
      [out:json][timeout:{t}];
      (
        node["historic"="tomb"]({s},{w},{n},{e});
        way["historic"="tomb"]({s},{w},{n},{e});
        way["historic"="tumulus"]({s},{w},{n},{e});
      );
      out geom qt;

  - id: osm-summits
    group: Relief
    name: Peaks, volcanoes and passes (OSM)
    adapter: overpass
    kind: peak
    default: false
    tile: 2.0
    licence: ODbL
    attribution: OpenStreetMap contributors
    query: |
      [out:json][timeout:{t}];
      (
        node["natural"="peak"]["name"]({s},{w},{n},{e});
        node["natural"="volcano"]["name"]({s},{w},{n},{e});
        node["mountain_pass"="yes"]["name"]({s},{w},{n},{e});
      );
      out body qt;

  # ---- physical setting --------------------------------------------------
  # Which stone was locally available bears directly on what got inscribed and
  # on what survived to be found, so this is a covariate rather than decoration.
  # cod_lito is the categorical key; litologia is the readable class.
  #
  # The layer name was read off the capabilities document:
  #   curl "https://sgi2.isprambiente.it/geoserver/ge-core8/wfs?service=WFS&version=2.0.0&request=GetCapabilities"
  #
  # WFS 1.0.0 on purpose: 2.0.0 with EPSG:4326 flips the axis order, and a bbox
  # given lon/lat then returns nothing at all rather than failing. No bbox is
  # sent here anyway; the whole country is fetched once and clipped locally.
  # ---- physical setting --------------------------------------------------
  # Which stone was locally available bears on what got inscribed and on what
  # survived to be found, so this is a covariate rather than decoration.
  # cod_lito is the categorical key; litologia is the readable class.
  #
  # Two scales are declared. The 1:500,000 is the default because it is
  # proportionate to the coordinates in this corpus: 2,242 inscriptions share a
  # single point and many findspots are municipality centroids, so a boundary
  # drawn at 1:100,000 is precision the corpus cannot use. The finer layer is
  # here for anyone who has better coordinates, but it is roughly 47 MB per
  # square degree, close to two gigabytes for the whole box.
  #
  # Layer names come from the capabilities document:
  #   curl "https://sgi2.isprambiente.it/geoserver/ge-core3/wfs?service=WFS&version=2.0.0&request=GetCapabilities"
  - id: ispra-lithology
    group: Physical setting
    name: Lithology (1:500.000)
    adapter: wfs
    wfs_url: https://sgi2.isprambiente.it/geoserver/ge-core3/wfs
    # One feature type, with lithology as attributes rather than as a layer of
    # its own. litho1 is the simple lithology and urn_litho is the same term as
    # a CGI SimpleLithology URI, which is a controlled vocabulary rather than
    # free text and is therefore the field to model on. Note that the 1:100,000
    # layer uses a different schema entirely (cod_lito, litologia), so the
    # covariate is not named the same at both scales.
    typename: ge-core3:geo500K
    tile: 2.0
    kind: geology
    name_fields: [litho1, formation_1, formazione]
    keep_fields: [litho1, litho2, urn_litho, lithounit, tipo_mat, composizione,
                  formazione, formation_1, etainf, etasup, cod_lege]
    simplify: 0.002
    default: false
    licence: CC BY 4.0
    attribution: ISPRA, Servizio Geologico d'Italia

  - id: ispra-lithology-100k
    group: Physical setting
    name: Lithology (1:100.000)
    adapter: wfs
    wfs_url: https://sgi2.isprambiente.it/geoserver/ge-core8/wfs
    typename: ge-core8:litologia100k
    # 0.5 degrees measured at about 12 MB and 3,200 polygons over southern
    # Etruria, which the server returns comfortably. Larger tiles are reset
    # before the response starts.
    tile: 0.5
    kind: geology
    name_fields: [litologia]
    keep_fields: [cod_lito, litologia, classi_litologiche, nome_ulf, eta_geol]
    simplify: 0.001
    default: false
    licence: CC BY 4.0
    attribution: ISPRA, Servizio Geologico d'Italia

  # ---- modern reference --------------------------------------------------
  - id: wikidata-sites
    group: Ancient geography
    name: Archaeological sites (Wikidata)
    adapter: wikidata
    kind: archaeological-site
    default: false
    licence: CC0
    attribution: Wikidata

  - id: istat-comuni
    group: Modern reference
    name: Comuni (ISTAT boundaries)
    adapter: geojson
    url: https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_municipalities.geojson
    kind: admin
    name_fields: [name, comune, prov_name]
    simplify: 0.002
    default: false
    licence: CC BY 4.0
    attribution: ISTAT via openpolis/geojson-italy

  - id: istat-province
    group: Modern reference
    name: Province (ISTAT boundaries)
    adapter: geojson
    url: https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_provinces.geojson
    kind: admin
    name_fields: [prov_name, name]
    simplify: 0.003
    default: false
    licence: CC BY 4.0
    attribution: ISTAT via openpolis/geojson-italy

# Layers that need a manual download, because the publisher puts them behind a
# form or a viewer rather than a stable file URL. Drop the file into .cache/
# under the name given and re-run; enrich_geo.py picks it up automatically.
#
#   Itiner-e, if api.nakala.fr will not verify on your network
#     https://doi.org/10.5281/zenodo.17122148  ->  .cache/local-itinere.geojson
#
#   HydroBASINS, catchment polygons. Standard / Europe and Middle East, level 6
#   as a spatial unit and level 8 for a finer one. It ships as shapefiles inside
#   one 345 MB archive, so convert the members you want:
#     python3 scripts/shapefile_to_layer.py hybas_eu_lev01-12_v1c.zip local-hydrobasins \
#         --member hybas_eu_lev06_v1c \
#         --fields HYBAS_ID PFAF_ID SUB_AREA UP_AREA NEXT_DOWN MAIN_BAS
#     https://www.hydrosheds.org/products  ->  .cache/local-hydrobasins.geojson
#
#   local-geology is a fallback for the ispra-lithology layer above. Use it only
#   if the WFS is unreachable: fetch the GML instead, open it in QGIS, export
#   GeoJSON, and save it as .cache/local-geology.geojson
#
local_sources:
  - id: local-itinere
    group: Movement
    name: Roman roads (Itiner-e, local copy)
    kind: roman-road
    name_fields: [name, road_name, label]
    simplify: 0.0008
    licence: CC BY 4.0
    attribution: Itiner-e, de Soto et al. 2025

  - id: local-hydrobasins
    group: Hydrography
    name: Catchments, level 6 (HydroBASINS)
    kind: basin
    keep_fields: [hybas_id, pfaf_id, sub_area, up_area, next_down, main_bas]
    simplify: 0.002
    licence: Free for scientific, educational and commercial use, with attribution
    attribution: HydroSHEDS, Lehner and Grill 2013

  - id: local-hydrobasins-8
    group: Hydrography
    name: Catchments, level 8 (HydroBASINS)
    kind: basin
    keep_fields: [hybas_id, pfaf_id, sub_area, up_area, next_down, main_bas]
    simplify: 0.0015
    licence: Free for scientific, educational and commercial use, with attribution
    attribution: HydroSHEDS, Lehner and Grill 2013

  - id: local-geology
    group: Physical setting
    name: Lithology (local copy)
    kind: geology
    name_fields: [litologia]
    keep_fields: [cod_lito, litologia, classi_litologiche, nome_ulf, eta_geol]
    simplify: 0.001
    licence: CC BY 4.0
    attribution: ISPRA, Servizio Geologico d'Italia
