<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">

<script>
  (function () {
    try {
      var t = localStorage.getItem('atlas-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* private mode: fall back to the system preference */ }
  })();
</script>

<link rel="preload" as="font" type="font/woff2" crossorigin
      href="{{ '/assets/fonts/spectral-400-normal-latin.woff2' | relative_url }}">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="{{ '/assets/fonts/public-sans-400-normal-latin.woff2' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/atlas.css' | relative_url }}">
{% if page.css %}<link rel="stylesheet" href="{{ page.css | relative_url }}">{% endif %}
<script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
