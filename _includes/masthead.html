<header class="masthead">
  <a class="wordmark" href="{{ '/' | relative_url }}">
    <span class="retrograde">Atlas</span>
    <span class="turn" aria-hidden="true">&#8617;</span>
    <span>Epigraphicus</span>
  </a>

  <nav aria-label="Main">
    <a href="{{ '/' | relative_url }}"        {% if page.nav == 'atlas'  %}aria-current="page"{% endif %}>Atlas</a>
    <a href="{{ '/browse/' | relative_url }}" {% if page.nav == 'browse' %}aria-current="page"{% endif %}>Browse</a>
    <a href="{{ '/places/' | relative_url }}" {% if page.nav == 'places' %}aria-current="page"{% endif %}>Gazetteer</a>
    <a href="{{ '/economy/' | relative_url }}" {% if page.nav == 'economy' %}aria-current="page"{% endif %}>Economy</a>
    <a href="{{ '/about/' | relative_url }}"  {% if page.nav == 'about'  %}aria-current="page"{% endif %}>About</a>
  </nav>

  <span class="spacer"></span>

  <button type="button" class="theme-toggle" id="theme-toggle" hidden>Dark</button>
</header>
